name: Odds & Quant Analytics Sync

on:
  schedule:
    # Runs twice daily at 06:00 UTC and 14:00 UTC
    - cron: "0 6,14 * * *"
  workflow_dispatch:

jobs:
  sync-odds-analytics:
    name: Sync Odds, Poisson Engine & Telegram SITREP
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install --no-cache-dir -r scripts/requirements.txt

      - name: Run odds & analytics sync
        env:
          FOOTBALL_DATA_TOKEN:       ${{ secrets.FOOTBALL_DATA_TOKEN }}
          ODDS_API_KEY:              ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN:        ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:          ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_BASE_URL:              "https://tips.imortifex.me/"
          GITHUB_REPOSITORY:         ${{ github.repository }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_KEY:      ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd scripts
          python sync_daily.py

      - name: Log completion
        if: always()
        run: echo "Odds and quant analytics sync finished at $(date -u)"
