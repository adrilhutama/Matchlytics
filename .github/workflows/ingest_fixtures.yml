name: Ingest Upcoming Fixtures (Fan-Out)

on:
  schedule:
    # Runs weekly every Monday at 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      leagues:
        description: "Comma-separated league codes (default: all)"
        required: false
        default: ""

jobs:
  sync-subagent:
    name: "${{ matrix.group_name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        include:
          - group_name: "Western Europe Core"
            leagues: "PL,PD,BL1"
          - group_name: "Southern & Central Europe"
            leagues: "SA,FL1,CL"
          - group_name: "Secondary European Leagues"
            leagues: "DED,PPL,ELC"
          - group_name: "Americas & Tournaments"
            leagues: "BSA,WC,EC"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install --no-cache-dir -r scripts/requirements.txt

      - name: Run Monthly Fixtures Subagent
        env:
          PYTHONUNBUFFERED: "1"
          FOOTBALL_DATA_TOKENS: ${{ secrets.FOOTBALL_DATA_TOKENS || secrets.FOOTBALL_DATA_TOKEN }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd scripts
          python -u sync_monthly_fixtures.py --leagues "${{ matrix.leagues }}"

      - name: Generate Subagent Summary
        if: always()
        env:
          GROUP_NAME: ${{ matrix.group_name }}
          LEAGUES: ${{ matrix.leagues }}
          RESULT: ${{ job.status }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ### ⚽ Subagent: $GROUP_NAME

          | Property | Value |
          | :--- | :--- |
          | **Group** | \`$GROUP_NAME\` |
          | **Target Leagues** | \`$LEAGUES\` |
          | **Worker Status** | $([[ "$RESULT" == "success" ]] && echo "PASS" || echo "FAILED") |
          | **Run Timestamp** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |

          > **Telemetry**: Database tables \`public.competitions\`, \`public.teams\`, and \`public.fixtures\` have been synchronized without schema violations.
          EOF

  aggregate-report:
    needs: sync-subagent
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Publish Consolidated SITREP
        run: |
          RESULT="${{ needs.sync-subagent.result }}"
          STATUS_ICON=$([[ "$RESULT" == "success" ]] && echo "PASS" || echo "ISSUES")
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          # \U0001f4ca Matchlytics Fixture Ingestion SITREP

          All 4 fan-out matrix subagents completed execution across all 12 Free Tier competitions.

          | Matrix Cluster | Covered Leagues | Status |
          | :--- | :--- | :--- |
          | Western Europe Core | Premier League (PL), La Liga (PD), Bundesliga (BL1) | ${STATUS_ICON} |
          | Southern & Central Europe | Serie A (SA), Ligue 1 (FL1), Champions League (CL) | ${STATUS_ICON} |
          | Secondary European Leagues | Eredivisie (DED), Liga Portugal (PPL), Championship (ELC) | ${STATUS_ICON} |
          | Americas & Tournaments | Brasileirao (BSA), World Cup (WC), Euro (EC) | ${STATUS_ICON} |

          **Overall result**: ${STATUS_ICON}
          **Aggregated at**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          EOF
